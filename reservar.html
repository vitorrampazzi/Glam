      <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content bg-dark">
            <div class="modal-header">
              <h1 class="modal-title fs-5 text-light" id="exampleModalLabel">Faça Seu Login</h1>
              <button type="button" class="btn-close bg-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="" id="formLogin">
              <div class="modal-body bg-dark">
                <div class="row">
                  <div class="col-12">
                    <label for="Usuario" class="form-label text-light">Usuário</label>
                    <input type="text" id="usuario" class="input bg-dark text-light" placeholder="Escreva Aqui...">
                  </div>

                  <div class="col-12 my-3">
                    <label for="senha" class="form-label text-light">Senha</label>
                    <input type="password" id="senha" class="input bg-dark text-light" placeholder="Escreva Aqui...">
                  </div>

                </div>
              </div>
              <div class="modal-footer bg-dark border-0">
                <button type="submit" class="btn btn-warning" id="btnLogin">Fazer Login</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </header>



    <div class="row">
      <div class="col-md-6">

        <h1>Selecione o dia que você quiser!</h1>

        <div class="calendar my-5">
          <div class="header">
            <div class="month"></div>
            <div class="btns">
              <div class="btn prev-btn">
                <i class="fas fa-chevron-left"></i> <!-- Ícone de seta para a esquerda -->
              </div>
              <div class="btn today-btn">
                <i class="fas fa-calendar-day"></i> <!-- Ícone para o botão hoje -->
              </div>
              <div class="btn next-btn">
                <i class="fas fa-chevron-right"></i> <!-- Ícone de seta para a direita -->
              </div>
            </div>
          </div>
          <div class="weekdays">
            <div class="day">Dom</div>
            <div class="day">Seg</div>
            <div class="day">Ter</div>
            <div class="day">Qua</div>
            <div class="day">Qui</div>
            <div class="day">Sex</div>
            <div class="day">Sab</div>
          </div>
          <div class="days">
            <!-- lets add days using js -->
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <h1 class="mb-5">Exigências a serem respondidas</h1>

        <form action="">

          <label for="local" class="form-label text-light my-4">Onde deseja receber atendimento?</label>
          <select name="local" id="local" class="input rounded">
            <option value="">Em Casa</option>
            <option value="">No local de Trabalho</option>
          </select>

          <label for="Horario" class="my-4 form-label text-light">Horário de Atendimento</label>
          <input type="time" name="horario" id="horario" class="input rounded" placeholder="13:50" maxlength="4"
            required>

          <label for="local" class="form-label text-light my-4">Quem irá receber o Atendimento?</label>
          <select name="local" id="local" class="input rounded">
            <option value="">Eu</option>
            <option value="">Outra pessoa</option>
          </select>

          <label for="Horario" class="my-4 form-label text-light">Nome da Pessoa</label>
          <input type="text" name="horario" id="horario" class="input rounded" placeholder="Não é obrigatório"
            maxlength="30">

          <div class="d-flex justify-content-end my-5">
            <a href="concluido.html" class="btn btn-warning p-3">Agendar</a>
          </div>

        </form>

      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
