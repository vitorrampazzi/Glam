<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="./css/CriarConta.css">
</head>

<body>
    <!-- menu principal -->

    <header>

        <nav class="navbar navbar-expand-lg">
            <div class="container my-4">
                <a class="navbar-brand" href="index.html">Glam</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <i class="bi bi-filter-right"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link" href="#about">Como funciona</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#vantagens">Vantagens</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="usuarios.html">Usuarios Cadastrados</a>
                        </li>


                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Profissionais
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#barbeiros">Barbeiro</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#cabeleireiros">Cabeleireiro</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#manicure">Manicure</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#maquiadoras">Maquiador</a></li>
                            </ul>
                        </li>

                        <li>
                            <a class="nav-link" href="./CriarConta.html">Criar Conta</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Login</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>

        <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content bg-dark">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5 text-light" id="exampleModalLabel">Faça Seu Login</h1>
                        <button type="button" class="btn-close bg-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <form action="" id="formLogin">
                        <div class="modal-body bg-dark">
                            <div class="row">
                                <div class="col-12">
                                    <label for="Usuario" class="form-label text-light">Usuário</label>
                                    <input type="text" id="usuario" class="input bg-dark text-light"
                                        placeholder="Escreva Aqui...">
                                </div>

                                <div class="col-12 my-3">
                                    <label for="senha" class="form-label text-light">Senha</label>
                                    <input type="password" id="senha" class="input bg-dark text-light"
                                        placeholder="Escreva Aqui...">
                                </div>

                            </div>
                        </div>
                        <div class="modal-footer bg-dark border-0">
                            <button type="submit" class="btn btn-warning" id="btnLogin">Fazer Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>


    <section class="container p-3">

        <div class="bg-dark rounded p-5">

            <div class="container my-4">

                <h1 class="display-6 text-light bg-dark p-4 rounded text-center">Tela de Cadastro - Glam</h1>

                <form action="" class="my-5" id="criarConta">
                    <div class="mb-4">
                        <h4 class=" display-6 my-3 text-light">Dados Pessoais</h4>
                        <hr>
                    </div>

                    <div class="row row-cols-1 row-cols-md-2 row-cols-3">

                        <div class="col my-2">
                            <label for="nome" class="form-label text-light">Nome</label>
                            <input type="text" name="nome" id="nome" class="input text-light rounded"
                                placeholder="Ex : fulano" maxlength="60" required>
                        </div>

                        <div class="col my-2">
                            <label for="sobrenome" class="form-label text-light">Sobrenome</label>
                            <input type="text" name="sobrenome" id="sobrenome" class="input rounded text-light"
                                placeholder="Ex : de tal" maxlength="60" required>
                        </div>

                        <div class="col my-2">
                            <label for="nascimento" class="form-label text-light">Nascimento</label>
                            <input type="date" class="input rounded text-light" name="nascimento" id="nascimento"
                                maxlength="10" required placeholder="02/08/1992">
                        </div>

                        <div class="col my-2">
                            <label for="genero" class="form-label text-light">Gênero</label>
                            <select name="genero" id="genero" class="input rounded text-light">
                                <option class="text-light" value="">Masculino</option>
                                <option class="text-light" value="">Feminino</option>
                                <option class="text-light" value="">Prefiro não declarar</option>
                            </select>
                        </div>

                        <div class="col my-2">
                            <label for="celular" class="form-label text-light">Celular</label>
                            <input type="text" name="celular" id="celular" class="input text-light rounded"
                                placeholder="(99)9999-9999" maxlength="16" required>
                        </div>

                        <div class="col my-2">
                            <label for="cpf" class="form-label text-light">CPF</label>
                            <input type="text" name="cpf" id="cpf" class="input text-light rounded"
                                placeholder="111.111.111.11" maxlength="14" required>
                        </div>

                    </div>
                    <div class="mb-4">
                        <h4 class="mt-5 display-6 my-3 text-light">Dados da conta</h4>
                        <hr>
                    </div>

                    <div class="row row-cols-1 row-cols-md-2">
                        <div class="col my-2">
                            <label for="email" class="form-label text-light">Email</label>
                            <input type="email" name="email" id="email" class="input text-light rounded"
                                placeholder="Ex : fulano@gmail.com" required>
                        </div>

                        <div class="col my-2">
                            <label for="confirmemail" class="form-label text-light">Confirmar Email</label>
                            <input type="email" name="confirmemail" id="confirmemail" class="input text-light rounded"
                                placeholder="confirme seu email" required>
                        </div>

                        <div class="col my-2">
                            <label for="senha" class="form-label text-light">Senha</label>
                            <input type="password" name="senha" id="senha" class="input text-light rounded"
                                placeholder="!@#$123123" minlength="8" maxlength="20" required>
                        </div>

                        <div class="col my-2">
                            <label for="senha" class="form-label text-light">Confirme a Senha</label>
                            <input type="password" name="senha" id="senha" class="input text-light rounded"
                                placeholder="confirme sua senha" minlength="8" maxlength="20" required>
                        </div>

                    </div>
                    <div class="mb-5">
                        <h4 class="mt-5 display-6 my-3 text-light mb-4">Dados do endereço</h4>
                        <hr>

                    </div>

                    <div class="my-2 d-flex align-items-center">
                        <input type="number" name="cep" id="cep" class="form-control text-dark rounded"
                            placeholder="Digite Seu CEP" maxlength="9" required>
                        <button class="btn btn-warning ms-2" type="button" id="btnCEP">Buscar</button>
                    </div>

                    <div class="row row-cols-1 row-cols-md-2">

                        <div class="col my-2">
                            <label for="logradouro" class="form-label text-dark">Logradouro</label>
                            <input type="text" name="logradouro" id="logradouro" class="form-control text-dark rounded"
                                placeholder="Rua, Avenida..." maxlength="60" required>
                        </div>

                        <div class="col my-2">
                            <label for="numero" class="form-label text-dark">Número</label>
                            <input type="text" name="numero" id="numero" class="form-control text-dark rounded"
                                placeholder="Número" maxlength="10" required>
                        </div>

                        <div class="col my-2">
                            <label for="complemento" class="form-label text-dark">Complemento</label>
                            <input type="text" class="form-control text-dark rounded" name="complemento"
                                placeholder="Apartamento, casa..." id="complemento">
                        </div>

                        <div class="col my-2">
                            <label for="bairro" class="form-label text-dark">Bairro</label>
                            <input type="text" class="form-control text-dark rounded" name="bairro" id="bairro"
                                placeholder="Bairro">
                        </div>

                        <div class="col my-2">
                            <label for="cidade" class="form-label text-dark">Cidade</label>
                            <input type="text" name="cidade" id="cidade" class="form-control text-dark rounded"
                                placeholder="Cidade" maxlength="30" required>
                        </div>

                        <div class="col my-2">
                            <label for="uf" class="form-label text-dark">UF</label>
                            <input type="text" name="uf" id="uf" class="form-control text-dark rounded"
                                placeholder="Estado" maxlength="2" required>
                        </div>
                    </div>

                    <h4 class="mt-5 mb-4 display-6 my-3 text-light">Dados do Cartão</h4>
                    <hr>


                    <div class="row row-cols-1 row-cols-md-2">
                        <div class="col my-2">
                            <label for="numerocard" class="form-label text-light">Numero do cartao</label>
                            <input type="text" name="numerocard" id="numerocard" class="input text-light rounded"
                                placeholder="Ex : 9999 9999 9999 9999" required maxlength="16">
                        </div>

                        <div class="col my-2">
                            <label for="nomeImpresso" class="form-label text-light">Nome impresso do cartao</label>
                            <input type="text" name="nomeImpresso" id="nomeImpresso" class="input text-light rounded"
                                placeholder="Nome Impresso" required>
                        </div>

                        <div class="col my-2">
                            <label for="validade" class="form-label text-light">Data de Validade</label>
                            <input type="date" class="input text-light rounded" name="validade" id="validade">
                        </div>

                        <div class="col my-2">
                            <label for="codigo" class="form-label text-light">Codigo de Segurança</label>
                            <input type="password" name="codigo" id="codigo" class="input text-light rounded"
                                placeholder="ex : 777" maxlength="3" required>
                        </div>
                    </div>
                    <div class="d-flex my-5 justify-content-end">
                        <button type="submit" class="btn btn-warning">
                            Criar sua conta <i class="bi bi-person-fill-add"></i>
                        </button>
                    </div>



                </form>
            </div>
        </div>
    </section>
    <script src="./js/criarConta.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/buscarCep.js"></script>
</body>

</html>
